[package]
name = "winctl2rust-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Policy-gated JSON-RPC 2.0 stdio MCP server exposing all 22 winctl2rust tools (40 MCP endpoints)"

[features]
default = []
test-support = [
    "winctl2rust-cmd/test-support",
    "winctl2rust-audio/test-support",
    "winctl2rust-display/test-support",
    "winctl2rust-desktop/test-support",
]

[[bin]]
name = "winctl2rust-mcp"
path = "src/main.rs"

[dependencies]
winctl2rust-core.workspace = true
winctl2rust-report.workspace = true
winctl2rust-cmd.workspace = true
winctl2rust-audio.workspace = true
winctl2rust-display.workspace = true
winctl2rust-desktop.workspace = true
guap-table.workspace = true
guap-mcp.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
winctl2rust-cmd = { path = "../winctl2rust-cmd", features = ["test-support"] }
winctl2rust-audio = { path = "../winctl2rust-audio", features = ["test-support"] }
winctl2rust-display = { path = "../winctl2rust-display", features = ["test-support"] }
winctl2rust-desktop = { path = "../winctl2rust-desktop", features = ["test-support"] }
