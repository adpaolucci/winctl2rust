[package]
name = "winctl2rust-display"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Multi-monitor CCD topology, DDC/CI VCP & MCCS 2.2a, display target metadata, and VESA EDID 1.3/1.4 + CEA-861 parser for winctl2rust"

[features]
default = []
test-support = []

[dependencies]
winctl2rust-core.workspace = true
guap-table.workspace = true
guap-mcp.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
