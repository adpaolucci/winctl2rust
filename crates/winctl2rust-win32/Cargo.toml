[package]
name = "winctl2rust-win32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Win32 virtual SysListView32 GUI console (guap-gui-win32 / winsafe) for winctl2rust"

[[bin]]
name = "winctl2rust-win32"
path = "src/main.rs"

[dependencies]
winctl2rust-core.workspace = true
winctl2rust-mcp.workspace = true
guap-table.workspace = true
guap-mcp.workspace = true
guap-gui-win32.workspace = true
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
tempfile.workspace = true
winctl2rust-cmd = { path = "../winctl2rust-cmd", features = ["test-support"] }
winctl2rust-audio = { path = "../winctl2rust-audio", features = ["test-support"] }
winctl2rust-display = { path = "../winctl2rust-display", features = ["test-support"] }
winctl2rust-desktop = { path = "../winctl2rust-desktop", features = ["test-support"] }
